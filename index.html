<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7ee">
  <title>HOKTO Mushroom New Year Omikuji</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="omikuji-game" class="game-shell">
    <section class="draw-screen" id="drawScreen" aria-label="Draw your fortune">
      <div class="box-stage" id="boxStage">
        <img id="boxImage" class="box-image" src="assets/Omikuji-box-no-stick.png" alt="Omikuji fortune box">
      </div>
      <button id="drawButton" class="primary-button" type="button">おみくじ&nbsp; Draw Your Fortune</button>
      <p id="statusText" class="status-text" aria-live="polite">Your fortune is waiting.</p>
    </section>

    <section id="resultScreen" class="result-screen" hidden aria-label="Your fortune result">
      <img id="fortuneImage" class="fortune-image" src="" alt="Your Omikuji fortune">
      <div class="result-actions">
        <button id="openShareButton" class="primary-button" type="button">Share My Fortune</button>
        <button id="drawAgainButton" class="secondary-button" type="button">Draw Again</button>
      </div>
      <p id="resultStatus" class="status-text" aria-live="polite"></p>
    </section>

    <div id="shareModal" class="share-overlay" hidden>
      <section class="share-modal" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
        <button id="closeShareButton" class="close-button" type="button" aria-label="Close share dialog">×</button>
        <h2 id="shareTitle">My Fortune Is... 🍄✨</h2>
        <p class="share-description">I just drew my fortune from the HOKTO Mushroom New Year Omikuji! 🍄✨ Try yours too!</p>
        <div class="share-options">
          <button class="share-btn" id="instagramShare" type="button"><span class="share-icon instagram-icon" aria-hidden="true">◎</span><span>Instagram</span></button>
          <button class="share-btn" id="whatsappShare" type="button"><span class="share-icon whatsapp-icon" aria-hidden="true">◔</span><span>WhatsApp</span></button>
          <button class="share-btn" id="facebookShare" type="button"><span class="share-icon" aria-hidden="true">f</span><span>Facebook</span></button>
          <button class="share-btn" id="xShare" type="button"><span class="share-icon" aria-hidden="true">𝕏</span><span>X</span></button>
          <button class="share-btn" id="telegramShare" type="button"><span class="share-icon" aria-hidden="true">➤</span><span>Telegram</span></button>
          <button class="share-btn" id="copyLinkShare" type="button"><span class="share-icon" aria-hidden="true">🔗</span><span>Copy Link</span></button>
        </div>
        <p id="shareFeedback" class="share-feedback" aria-live="polite"></p>
        <p class="instagram-note">Instagram sharing works best on mobile. You can share the link or take a screenshot of your fortune for your Story.</p>
      </section>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
